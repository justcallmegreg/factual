[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: builds and runs the container image (skipped without a Docker daemon)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests and for invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S603", "S607"]  # subprocess with fixed argv is fine in tests
