# Every push runs lint, the tests and the swagger check. A push to main (a merge)
# also builds the image for linux/amd64 and linux/arm64. To make a failed step
# block a merge, require the "check" job as a status check in the branch
# protection rules of main (Settings → Branches on GitHub).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, test, swagger-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factual
          POSTGRES_PASSWORD: factual
          POSTGRES_DB: factual
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factual -d factual"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      s3:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: factual
          RUSTFS_SECRET_KEY: factual-dev-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -sf http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: PostgreSQL 17 client tools for the restore drill
        run: >-
          sudo apt-get install -y postgresql-client-17
          || echo "::warning::postgresql-client-17 not installed; the restore drill test is skipped"
      - run: make lint
      - run: make test
        env:
          TEST_DATABASE_URL: postgresql://factual:factual@localhost:5432/factual
          TEST_S3_ENDPOINT: http://localhost:9000
      - run: make swagger-check

  build:
    name: build image for linux/amd64 and linux/arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: make build
        working-directory: backend
